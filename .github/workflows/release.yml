name: Release

# Versions live on GitHub. Bump "version" in package.json (npm run release:patch / release:minor),
# merge to main, and this workflow tags vX.Y.Z, builds, attaches the installable tarball to a
# GitHub Release and (if the NPM_TOKEN secret exists) publishes to npm.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Read version
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          # npm is checked separately so a version released before NPM_TOKEN existed still gets published later
          # (re-run this workflow from the Actions tab).
          if [ -n "$NPM_TOKEN" ] && ! npm view "grugbrain@$V" version >/dev/null 2>&1; then echo "npm=true" >> "$GITHUB_OUTPUT"; else echo "npm=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build and test
        if: steps.v.outputs.exists == 'false' || steps.v.outputs.npm == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm pack
      - name: Tag and create GitHub Release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          NOTES=$(awk -v v="## $V" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="Release v$V"
          gh release create "v$V" "grugbrain-$V.tgz" --title "grugbrain v$V" --notes "$NOTES
          
          **Install this version:**
          \`\`\`
          npx --yes github:${{ github.repository }}#v$V install
          \`\`\`
          or from the attached file: \`npx --yes --package=https://github.com/${{ github.repository }}/releases/download/v$V/grugbrain-$V.tgz grugbrain install\`
          or from npm (when published): \`npm install -g grugbrain@$V && grug install\`"
      - name: Publish to npm
        if: steps.v.outputs.npm == 'true'
        # A bad/expired npm token must not hide that the GitHub Release succeeded.
        continue-on-error: true
        run: |
          npm publish --provenance --access public || {
            echo "::warning title=npm publish failed::Check NPM_TOKEN (granular token, Read and write, bypass 2FA enabled), then re-run this workflow from the Actions tab."
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
